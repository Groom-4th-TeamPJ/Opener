
services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: db-dev
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev123
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ with STOMP plugin
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: opener-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
      - "61613:61613"  # STOMP port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      bash -c "
        rabbitmq-plugins enable rabbitmq_stomp rabbitmq_web_stomp &&
        rabbitmq-server
      "

  # Backend (Spring Boot)
  backend:
    image: ${DOCKERHUB_USERNAME}/opener-backend:dev
    container_name: backend-dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TIMEOUT=3000
      - REDIS_CHAT_HOST=redis
      - REDIS_CHAT_PORT=6380
      - REDIS_CHAT_TIMEOUT=3000
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - TZ=Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped

  # Frontend (Development with Hot Reload)
  frontend:
    image: ${DOCKERHUB_USERNAME}/opener-frontend:dev
    container_name: frontend-dev
    environment:
      - NODE_ENV=development
      - TZ=Asia/Seoul
    ports:
      - "3000:3000"
    networks:
      - dev-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional for dev)
  nginx:
    image: ${DOCKERHUB_USERNAME}/opener-nginx:dev
    container_name: nginx-dev
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
  certbot-www:
  rabbitmq_data:
