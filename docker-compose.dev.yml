
services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg15
    container_name: db-dev
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - dev-network
    command: postgres -c shared_preload_libraries=vector
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

    # Redis - Auth / Token
  redis-auth:
    image: redis:7-alpine
    container_name: redis-auth
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Chat / Realtime
  redis-chat:
    image: redis:7-alpine
    container_name: redis-chat
    command: redis-server --port 6380
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6380:6380"
    volumes:
      - redis_chat_data:/data
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6380", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ with STOMP plugin
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-dev
    env_file:
      - .env
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
      - "61613:61613"  # STOMP port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      bash -c "
        rabbitmq-plugins enable rabbitmq_stomp rabbitmq_web_stomp &&
        rabbitmq-server
      "

  # Backend (Spring Boot)
  backend:
    image: ${DOCKERHUB_USERNAME}/opener-backend:dev
    container_name: backend-dev
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    networks:
      - dev-network
    restart: unless-stopped

  # Frontend (Development with Hot Reload)
  frontend:
    image: ${DOCKERHUB_USERNAME}/opener-frontend:dev
    container_name: frontend-dev
    environment:
      - NODE_ENV=development
      - TZ=Asia/Seoul
    ports:
      - "3000:3000"
    networks:
      - dev-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional for dev)
  nginx:
    image: ${DOCKERHUB_USERNAME}/opener-nginx:dev
    container_name: nginx-dev
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - dev-network
    restart: unless-stopped

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_chat_data:
  redis_auth_data:
  certbot-www:
  rabbitmq_data:
