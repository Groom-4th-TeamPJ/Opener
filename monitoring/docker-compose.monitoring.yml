services:
  Prometheus:
    image: prom/prometheus:latest
    container_name: Prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"  # 설정 파일 경로
      - "--storage.tsdb.path=/prometheus" # 데이터 저장 경로
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring-network

  Grafana:
    image: grafana/grafana:latest
    container_name: Grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin1234
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=grafana-db:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana_pw
    volumes:
      - grafana-data:/var/lib/grafana
      # Datasource + dashboard provider config (Step 3)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSONs — referenced by dashboards.yaml provider
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - monitoring-network
    depends_on:
      - Prometheus
      - grafana-db
      - Loki

  grafana-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=grafana_pw
    ports:
      - "5433:5432"
    volumes:
      - grafana-db-data:/var/lib/postgresql/data
    networks:
      - monitoring-network

  # ========== Logs: Loki + Promtail (Monitoring Step 2) ==========
  Loki:
    image: grafana/loki:3.0.0
    container_name: Loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - monitoring-network

  Promtail:
    image: grafana/promtail:3.0.0
    container_name: Promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Backend JSON log file mount — must match logback-spring.xml's <file> path on host
      - /var/log/backend:/var/log/backend:ro
      # Docker socket for container stdout scraping (job: docker-containers)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - Loki
    restart: unless-stopped
    networks:
      - monitoring-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host   # 호스트의 프로세스 ID 네임스페이스 사용
    network_mode: host # 호스트 네트워크 사용
    ports:
      - "9100:9100"
    restart: unless-stopped
    command:
      - "--path.rootfs=/rootfs"     # 호스트의 루트 파일 시스템 경로 설정
    volumes:
      - "/:/host:ro,rslave"  # 호스트 파일 시스템을 읽기 전용으로 마운트

volumes:
  prometheus-data:
  grafana-data:
  grafana-db-data:
  loki-data:

networks:
  monitoring-network:
    driver: bridge