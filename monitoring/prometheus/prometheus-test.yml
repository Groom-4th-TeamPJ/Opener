global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 자체
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          env: "test"

  # Spring Boot (호스트에서 실행)
  - job_name: "app-backend"
    metrics_path: "/api/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          env: "test"
          service: "backend"
