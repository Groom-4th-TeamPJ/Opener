spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 환경변수 참조, 기본값 dev

  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true} # Virtual Thread 활성화 (env로 토글, 기본 true)

  config:
    import: "optional:env[.env]" # spring-dotenv: .env 파일 로드 (없어도 무시)

  application:
    name: backend # 애플리케이션 이름

  # JPA 공통 설정
  jpa:
    open-in-view: false # OSIV 비활성화 (성능 최적화)
    properties:
      hibernate:
        format_sql: true # SQL 포맷팅
        highlight_sql: true # SQL 하이라이트

  # SSE 및 Async 설정
  mvc:
    async:
      request-timeout: 1800000  # 30분 (SSE 타임아웃)

# Actuator 설정
management:
  metrics:
    distribution:
      percentiles:
        http:server.requests: 0.95,0.99
      percentiles-histogram:
        http.server.requests: true
        jvm.gc.pause: true                  # GC Pause p95 패널용 히스토그램
        hikaricp.connections.acquire: true  # HikariCP 획득 대기 p95 패널용 히스토그램
        rag.vector.search: true             # RAG 벡터 검색 p95 패널용 히스토그램
        chat.sse.ttft: true                 # SSE 첫 토큰(TTFT) p95 패널용 히스토그램
    tags:
      application: ${spring.application.name:backend}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized

# 로깅 설정
logging:
  level:
    root: INFO
    spring.backend: DEBUG # 프로젝트 패키지 로그 레벨

server:
  servlet:
    context-path: /api
  # 프록시(nginx) 뒤에서 X-Forwarded-* 헤더 신뢰
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true # tomcat_threads_* 메트릭 노출 (요청 스레드 풀 busy/current/max 관측)

# 보안 설정
security:
  account-lock:
    max-attempts: 5            # 최대 로그인 실패 허용 횟수
    lock-duration-minutes: 5   # 계정 잠금 시간(분)

# OAuth2 설정
app:
  oauth2:
    signup-redirect-uri: ${OAUTH2_REDIRECT_URI:https://opener.ai.kr/register}
    login-success-uri: ${OAUTH2_LOGIN_SUCCESS_URI:https://opener.ai.kr}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:https://opener.ai.kr/login}
  llm:
    connect-timeout: 5s      # OpenAI 연결 수립 상한
    response-timeout: 20s    # 토큰 도착 사이의 최대 간격 - 총 응답 시간 상한이 아님

# Virtual Thread 활성화 시 task.execution.pool 설정 무시
# (Spring Boot가 VT 기반 SimpleAsyncTaskExecutor를 자동 제공)

# Resilience4j Circuit Breaker
# - llm-chat: 일반 채팅 OpenAI 스트리밍 보호
# - llm-rag: 오프너 분석 OpenAI 스트리밍 보호
# - redis-chat: Chat Redis Cluster 장애 시 빠른 실패
resilience4j:
  circuitbreaker:
    instances:
      llm-chat:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50            # 실패율 50% 초과 시 OPEN
        waitDurationInOpenState: 30s        # 30초 후 HALF-OPEN 전이
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # LLM 경로의 BusinessException 은 전부 도메인 판정(RAG_DISABLED 등)이라 인프라 실패가 아님
        ignoreExceptions:
          - spring.backend.shared.response.exception.BusinessException
      llm-rag:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # LLM 경로의 BusinessException 은 전부 도메인 판정(RAG_DISABLED 등)이라 인프라 실패가 아님
        ignoreExceptions:
          - spring.backend.shared.response.exception.BusinessException
      llm-summary:                          # 대화 요약 - 동기 호출이라 컨슈머 재시도와 곱해지는 것을 막는다
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # LLM 경로의 BusinessException 은 전부 도메인 판정이라 인프라 실패가 아님
        ignoreExceptions:
          - spring.backend.shared.response.exception.BusinessException
      redis-chat:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 화이트리스트 방식 -> 만료 세션·소유자 불일치 같은 사용자 오류가 서킷을 열지 못하게 한다
        recordExceptions:
          - org.springframework.dao.DataAccessException
          - io.lettuce.core.RedisException
      test-circuit:                         # 가상 장애 주입 측정용 (llm-chat 과 동일 정책)
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true