spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 환경변수 참조, 기본값 dev

  application:
    name: backend # 애플리케이션 이름

  # JPA 공통 설정
  jpa:
    open-in-view: false # OSIV 비활성화 (성능 최적화)
    properties:
      hibernate:
        format_sql: true # SQL 포맷팅
        highlight_sql: true # SQL 하이라이트

# Actuator 설정
management:
  metrics:
    tags:
      application: ${spring.application.name:backend}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

  # 로깅 설정
  logging:
    level:
      root: INFO
      spring.backend: DEBUG # 프로젝트 패키지 로그 레벨

  # SSE 및 Async 설정
  mvc:
    async:
      request-timeout: 300000  # 5분 (SSE 타임아웃)

server:
  servlet:
    context-path: /api
  # 프록시(nginx) 뒤에서 X-Forwarded-* 헤더 신뢰
  forward-headers-strategy: framework

# 보안 설정
security:
  account-lock:
    max-attempts: 5            # 최대 로그인 실패 허용 횟수
    lock-duration-minutes: 5   # 계정 잠금 시간(분)

# OAuth2 설정
app:
  oauth2:
    signup-redirect-uri: ${OAUTH2_REDIRECT_URI:https://opener.deving.xyz/register}
    login-success-uri: ${OAUTH2_LOGIN_SUCCESS_URI:https://opener.deving.xyz}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:https://opener.deving.xyz/login}

# Async 설정
task:
  execution:
    pool:
      core-size: 10
      max-size: 20
      queue-capacity: 100