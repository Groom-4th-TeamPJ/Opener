spring:
  # PostgreSQL 데이터베이스 설정
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:dev123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: validate # Flyway가 스키마 관리
    show-sql: false
    properties:
      hibernate:

  # Flyway 마이그레이션 설정
  flyway:
    enabled: true # 스키마 생성 및 테스트 데이터 삽입
    baseline-on-migrate: false # 깨끗한 DB에서 시작
    locations: classpath:db/migration
    validate-on-migrate: true # 스키마 검증 활성화

  # Redis 설정
  data:
    redis:

      # 토큰용 redis 접속 설정 (Standalone)
      auth:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        timeout: ${REDIS_TIMEOUT:3000}ms

      # 채팅용 Redis Cluster 설정
      # 실무 권장: 리스트 형태로 각 노드별 환경변수 지원
      # 기본값: host.docker.internal (Mac /etc/hosts에 127.0.0.1 host.docker.internal 추가 필요)
      # 배포시 .env에서 실제 호스트로 오버라이드
      chat:
        cluster:
          nodes:
            - ${REDIS_CLUSTER_NODE_0:host.docker.internal:6380}
            - ${REDIS_CLUSTER_NODE_1:host.docker.internal:6381}
            - ${REDIS_CLUSTER_NODE_2:host.docker.internal:6382}
            - ${REDIS_CLUSTER_NODE_3:host.docker.internal:6383}
            - ${REDIS_CLUSTER_NODE_4:host.docker.internal:6384}
            - ${REDIS_CLUSTER_NODE_5:host.docker.internal:6385}
          max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:3}
        timeout: ${REDIS_CHAT_TIMEOUT:3000}

  # RabbitMQ 설정
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1 # 한 번에 하나의 메시지만 처리
        acknowledge-mode: auto # 자동 ACK
        retry:
          enabled: true
          initial-interval: 3000 # 3초 후 재시도
          max-attempts: 3 # 최대 3회 재시도

  # Spring AI 설정
  ai:
    openai:
      api-key: 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
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1}
          temperature: 0.7
          max-tokens: 8000
        base-url: https://api.openai.com
      embedding:
        options:
          model: text-embedding-3-small

    # PgVector Store 설정 - 수동 설정 사용 (VectorStoreConfig.java)
    # VectorStoreConfig에서 PgVectorStore 빈을 수동으로 생성하므로 자동 설정 비활성화
    vectorstore:
      pgvector:
        enabled: false  # 수동 설정(VectorStoreConfig)과 충돌 방지

  # Security 개발 설정 (필요시 커스터마이징)
  security:
    user:
      name: admin # 기본 사용자 이름
      password: admin # 기본 비밀번호 (개발용)

    account-lock:
      max-attempts: 5            # 최대 로그인 실패 허용 횟수
      lock-duration-minutes: 1   # 개발 환경: 1분 (테스트 용이성)

    oauth2:
      client:
        registration:
          kakao:
            client-id: ${REST_API_KEY}
            client-secret: ${CLIENT_SECRET_KEY}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${OAUTH2_KAKAO_REDIRECT_URI:http://localhost:8080/api/login/oauth2/code/kakao}
            scope:
              - profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# Swagger/OpenAPI 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
    url: /v3/api-docs
  api-docs:
    path: /v3/api-docs


  # 개발 환경 로깅
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      org.springframework.security: DEBUG
      org.flywaydb: DEBUG

# JWT 설정 (개발 환경)
jwt:
  secret: your-very-secure-secret-key-change-this-in-production-min-32-chars
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일

# Application 커스텀 설정
app:
  cookie:
    secure: false    # HTTP 로컬 환경에서 쿠키 전송 허용
    same-site: Lax   # localhost same-site 환경에서는 Lax로 충분 (None+Secure는 HTTPS 필요)
  # CORS 설정
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://opener.vercel.app
  # RAG (Retrieval-Augmented Generation) 설정
  rag:
    enabled: true                    # RAG 기능 활성화
    top-k: 5                         # 유사 문서 검색 시 반환할 최대 개수
    similarity-threshold: 0.2        # 유사도 임계값 - 영어 문서 + 한국어 쿼리는 유사도가 낮음
