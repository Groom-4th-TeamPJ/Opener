spring:
  # PostgreSQL 데이터베이스 설정
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:dev123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: validate # Flyway가 스키마 관리
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway 마이그레이션 설정
  flyway:
    enabled: true # 스키마 생성 및 테스트 데이터 삽입
    baseline-on-migrate: false # 깨끗한 DB에서 시작
    locations: classpath:db/migration
    validate-on-migrate: true # 스키마 검증 활성화

  # Redis 설정
  data:
    redis:

      # 토큰용 redis 접속 설정
      auth:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        timeout: ${REDIS_TIMEOUT:3000}ms
      
      # 채팅용 redis 접속 설정
      chat:
        host: ${REDIS_CHAT_HOST:localhost}
        port: ${REDIS_CHAT_PORT:6380}
        timeout: ${REDIS_CHAT_TIMEOUT:3000}ms

  # RabbitMQ 설정
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1 # 한 번에 하나의 메시지만 처리
        acknowledge-mode: auto # 자동 ACK
        retry:
          enabled: true
          initial-interval: 3000 # 3초 후 재시도
          max-attempts: 3 # 최대 3회 재시도

  # Spring AI 설정
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.7
          max-tokens: 2000
        base-url: https://api.openai.com
      embedding:
        options:
          model: text-embedding-ada-002

    # PgVector Store 설정 (Spring AI 2.0 자동 설정)
    vectorstore:
      pgvector:
        enabled: true
        dimensions: 1536                    # text-embedding-ada-002 dimension
        distance-type: COSINE_DISTANCE      # 유사도 측정 방식
        remove-existing-vector-store-table: false
        initialize-schema: true             # 스키마 자동 초기화
        index-type: HNSW                    # 인덱스 타입 (성능 최적화)

  # Security 개발 설정 (필요시 커스터마이징)
  security:
    user:
      name: admin # 기본 사용자 이름
      password: admin # 기본 비밀번호 (개발용)

    account-lock:
      max-attempts: 5            # 최대 로그인 실패 허용 횟수
      lock-duration-minutes: 1   # 개발 환경: 1분 (테스트 용이성)

    oauth2:
      client:
        registration:
          kakao:
            client-id: ${REST_API_KEY}
            client-secret: ${CLIENT_SECRET_KEY}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # Swagger/OpenAPI 설정
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: alpha
    api-docs:
      path: /api-docs

  # 개발 환경 로깅
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      org.springframework.security: DEBUG
      org.flywaydb: DEBUG

# JWT 설정 (개발 환경)
jwt:
  secret: your-very-secure-secret-key-change-this-in-production-min-32-chars
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일

# Application 커스텀 설정
app:
  # CORS 설정
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://opener.vercel.app
  # RAG (Retrieval-Augmented Generation) 설정
  rag:
    enabled: true                    # RAG 기능 활성화
    top-k: 5                         # 유사 문서 검색 시 반환할 최대 개수
    similarity-threshold: 0.7        # 유사도 임계값 (0.0 ~ 1.0)
