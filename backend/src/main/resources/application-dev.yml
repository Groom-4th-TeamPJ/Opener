spring:
  # PostgreSQL 데이터베이스 설정
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:dev123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: update # create, create-drop, update, validate, none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway 마이그레이션 설정
  flyway:
    enabled: false # 개발 환경에서는 JPA ddl-auto 사용
    baseline-on-migrate: true # 기존 DB에 Flyway 적용 시 필요
    locations: classpath:db/migration
    validate-on-migrate: true

  # Redis 설정
  data:
    redis:

      # 토큰용 redis 접속 설정
      auth:
        host: localhost
        port: 6379
        timeout: 3000ms
      
      # 채팅용 redis 접속 설정
      chat:
        host: localhost
        port: 6380
        timeout: 3000ms

  # RabbitMQ 설정
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1 # 한 번에 하나의 메시지만 처리
        acknowledge-mode: auto # 자동 ACK
        retry:
          enabled: true
          initial-interval: 3000 # 3초 후 재시도
          max-attempts: 3 # 최대 3회 재시도

  # Spring AI 설정
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.7
          max-tokens: 2000
        base-url: https://api.openai.com

  # Security 개발 설정 (필요시 커스터마이징)
  security:
    user:
      name: admin # 기본 사용자 이름
      password: admin # 기본 비밀번호 (개발용)

  # Swagger/OpenAPI 설정
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: alpha
    api-docs:
      path: /api-docs

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-very-secure-secret-key-change-this-in-production-min-32-chars}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000} # 1시간
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7일

# 개발 환경 로깅
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG

# 개발 환경용 보안 설정 (테스트 편의성)
security:
  account-lock:
    max-attempts: 5            # 최대 로그인 실패 허용 횟수
    lock-duration-minutes: 1   # 개발 환경: 1분 (테스트 용이성)