version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: opener-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opener-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: opener-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - opener-network

  # RabbitMQ with STOMP plugin
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: opener-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
      - "61613:61613"  # STOMP port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - opener-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      bash -c "
        rabbitmq-plugins enable rabbitmq_stomp rabbitmq_web_stomp &&
        rabbitmq-server
      "

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  opener-network:
    driver: bridge
