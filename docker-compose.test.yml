services:
  # PostgreSQL Database with pgvector extension
  db:
    image: pgvector/pgvector:pg15
    container_name: db-test
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev123
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    networks:
      - test-network
    command: postgres -c shared_preload_libraries=vector

  # Redis - Auth / Token
  redis-auth:
    image: redis:7-alpine
    container_name: redis-auth
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data
    networks:
      - test-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Chat / Realtime
  redis-chat:
    image: redis:7-alpine
    container_name: redis-chat
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6380:6379"
    volumes:
      - redis_chat_data:/data
    networks:
      - test-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker with STOMP plugin
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-test
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - TZ=Asia/Seoul
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
      - "61613:61613" # STOMP port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - test-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: >
      sh -c "
        rabbitmq-plugins enable rabbitmq_stomp rabbitmq_web_stomp &&
        rabbitmq-server
      "

  # Frontend (Development with Hot Reload)
  frontend:
    image: node:22-alpine
    container_name: frontend-test
    working_dir: /app
    env_file:
      - ./frontend/.env.development
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    networks:
      - test-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-test
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.test.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - test-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  test-network:
    driver: bridge

volumes:
  postgres_data_test:
  redis_auth_data:
  redis_chat_data:
  rabbitmq_data:
