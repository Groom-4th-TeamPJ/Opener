services:
  # PostgreSQL Database with pgvector extension
  db:
    image: pgvector/pgvector:pg15
    container_name: db-test
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev123
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    networks:
      - test-network
    command: postgres -c shared_preload_libraries=vector

  # Redis - Auth / Token
  redis-auth:
    image: redis:7-alpine
    container_name: redis-auth
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data
    networks:
      - test-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cluster - Chat (6 Nodes: 3 Master + 3 Replica)
  # ============================================

  redis-chat-1:
    image: redis:7-alpine
    container_name: redis-chat-1
    command: redis-server /etc/redis/redis.conf --port 6380 --cluster-announce-hostname host.docker.internal --cluster-announce-port 6380 --cluster-announce-bus-port 16380
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6380:6380"
      - "16380:16380"
    volumes:
      - ./redis-cluster/redis-node.conf:/etc/redis/redis.conf
      - redis_chat_1_data:/data
    networks:
      - test-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6380", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-chat-2:
    image: redis:7-alpine
    container_name: redis-chat-2
    command: redis-server /etc/redis/redis.conf --port 6381 --cluster-announce-hostname host.docker.internal --cluster-announce-port 6381 --cluster-announce-bus-port 16381
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6381:6381"
      - "16381:16381"
    volumes:
      - ./redis-cluster/redis-node.conf:/etc/redis/redis.conf
      - redis_chat_2_data:/data
    networks:
      - test-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6381", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-chat-3:
    image: redis:7-alpine
    container_name: redis-chat-3
    command: redis-server /etc/redis/redis.conf --port 6382 --cluster-announce-hostname host.docker.internal --cluster-announce-port 6382 --cluster-announce-bus-port 16382
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6382:6382"
      - "16382:16382"
    volumes:
      - ./redis-cluster/redis-node.conf:/etc/redis/redis.conf
      - redis_chat_3_data:/data
    networks:
      - test-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6382", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-chat-4:
    image: redis:7-alpine
    container_name: redis-chat-4
    command: redis-server /etc/redis/redis.conf --port 6383 --cluster-announce-hostname host.docker.internal --cluster-announce-port 6383 --cluster-announce-bus-port 16383
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6383:6383"
      - "16383:16383"
    volumes:
      - ./redis-cluster/redis-node.conf:/etc/redis/redis.conf
      - redis_chat_4_data:/data
    networks:
      - test-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6383", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-chat-5:
    image: redis:7-alpine
    container_name: redis-chat-5
    command: redis-server /etc/redis/redis.conf --port 6384 --cluster-announce-hostname host.docker.internal --cluster-announce-port 6384 --cluster-announce-bus-port 16384
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6384:6384"
      - "16384:16384"
    volumes:
      - ./redis-cluster/redis-node.conf:/etc/redis/redis.conf
      - redis_chat_5_data:/data
    networks:
      - test-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6384", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-chat-6:
    image: redis:7-alpine
    container_name: redis-chat-6
    command: redis-server /etc/redis/redis.conf --port 6385 --cluster-announce-hostname host.docker.internal --cluster-announce-port 6385 --cluster-announce-bus-port 16385
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6385:6385"
      - "16385:16385"
    volumes:
      - ./redis-cluster/redis-node.conf:/etc/redis/redis.conf
      - redis_chat_6_data:/data
    networks:
      - test-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "6385", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis Cluster Initialization
  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    depends_on:
      redis-chat-1:
        condition: service_healthy
      redis-chat-2:
        condition: service_healthy
      redis-chat-3:
        condition: service_healthy
      redis-chat-4:
        condition: service_healthy
      redis-chat-5:
        condition: service_healthy
      redis-chat-6:
        condition: service_healthy
    volumes:
      - ./redis-cluster/create-cluster.sh:/scripts/create-cluster.sh
    entrypoint: [ "/bin/sh", "/scripts/create-cluster.sh" ]
    networks:
      - test-network
    restart: "no"

  # RabbitMQ Message Broker with STOMP plugin
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-test
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - TZ=Asia/Seoul
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
      - "15692:15692" # Prometheus metrics (rabbitmq_prometheus)
      - "61613:61613" # STOMP port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - test-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: >
      sh -c "
        rabbitmq-plugins enable rabbitmq_stomp rabbitmq_web_stomp rabbitmq_prometheus &&
        rabbitmq-server
      "

  # Frontend (Development with Hot Reload)
  frontend:
    image: node:22-alpine
    container_name: frontend-test
    working_dir: /app
    env_file:
      - ./frontend/.env.development
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    networks:
      - test-network
    restart: unless-stopped
    # 부하테스트/모니터링엔 불필요 → web 프로파일 지정 시에만 기동
    profiles:
      - web

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-test
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.test.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - test-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # frontend upstream에 의존 → web 프로파일에서만 기동
    profiles:
      - web

  # ============================================
  # k6 부하 테스트 (profile: k6)
  # ============================================
  # 사용법:
  #   docker compose -f docker-compose.test.yml --profile k6 run --rm k6
  #   docker compose -f docker-compose.test.yml --profile k6 run --rm k6 run /scripts/01_auth_check.js
  #   docker compose -f docker-compose.test.yml --profile k6 run --rm -e RPS=10 k6 run /scripts/04_rps_limit.js
  k6:
    image: grafana/k6:latest
    container_name: k6-load-test
    volumes:
      - ./backend/k6:/scripts
    environment:
      - BASE_URL=http://host.docker.internal:8080/api
      - TEST_EMAIL=test@test.com
      - TEST_PASSWORD=password123
      - HOLD_SECONDS=8
      # k6 메트릭(VU·요청수·지연)을 Prometheus로 직접 전송 → Grafana 부하 대시보드에 표시
      # monitoring 프로파일이 함께 떠 있어야 prometheus가 수집 가능
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),avg,max
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - test-network
    profiles:
      - k6
    # -o experimental-prometheus-rw: k6 결과를 Prometheus remote write로 송출
    command: run -o experimental-prometheus-rw --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" /scripts/03_thread_exhaustion.js

  # ============================================
  # 모니터링 (profile: monitoring)
  # ============================================
  # 사용법:
  #   docker compose -f docker-compose.test.yml --profile monitoring up -d
  #   Grafana: http://localhost:3001 (admin / admin1234)
  #   Prometheus: http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus-test.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_test:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    networks:
      - test-network
    profiles:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: loki-test
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data_test:/loki
    ports:
      - "3100:3100"
    networks:
      - test-network
    profiles:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail-test
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./monitoring/promtail/promtail-test-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - test-network
    profiles:
      - monitoring
    restart: unless-stopped

  grafana-db:
    image: postgres:16
    container_name: grafana-db-test
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=grafana_pw
    volumes:
      - grafana_db_data_test:/var/lib/postgresql/data
    networks:
      - test-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-test
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin1234
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=grafana-db:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana_pw
    volumes:
      - grafana_data_test:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - grafana-db
      - loki
    networks:
      - test-network
    profiles:
      - monitoring
    restart: unless-stopped

  # ============================================
  # Redis Exporter (profile: monitoring)
  # ============================================
  # 멀티타깃 모드: Prometheus 가 /scrape?target=redis://<node> 로 각 노드 지표 수집
  # 대상: Auth(redis-auth:6379) + Chat Cluster 6노드(redis-chat-1~6: 6380~6385)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-test
    command:
      - "--include-system-metrics"
    ports:
      - "9121:9121"
    networks:
      - test-network
    profiles:
      - monitoring
    restart: unless-stopped

networks:
  test-network:
    driver: bridge

volumes:
  postgres_data_test:
  redis_auth_data:
  redis_chat_1_data:
  redis_chat_2_data:
  redis_chat_3_data:
  redis_chat_4_data:
  redis_chat_5_data:
  redis_chat_6_data:
  rabbitmq_data:
  prometheus_data_test:
  loki_data_test:
  grafana_data_test:
  grafana_db_data_test:
