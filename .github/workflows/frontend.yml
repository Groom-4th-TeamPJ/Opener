name: Frontend CI & Template Enforcer

on:
  pull_request:
    branches:
      - frontend
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  pull-requests: write
  contents: read

jobs:
  # Job 1: PR 본문 업데이트 (안정적인 GitHub Script 방식)
  apply-template:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: frontend

      - name: Read Template and Update PR
        uses: actions/github-script@v7
        with:
          # 여기서 secrets.GITHUB_TOKEN은 GitHub이 자동 생성하므로 따로 설정 안 해도 됩니다.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            // frontend 브랜치의 템플릿 경로를 읽습니다.
            const template = fs.readFileSync('.github/pull_request_template.md', 'utf8');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: template
            });

  # Job 2: CI 검사
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Build check
        run: pnpm build
