name: Build and Deploy to EC2

on:
  push:
    branches: [ backend ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Docker Buildx 설정 (멀티 플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Frontend 이미지 빌드 및 푸시
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/opener-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/opener-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/opener-frontend:buildcache,mode=max

      # 5. Backend 이미지 빌드 및 푸시
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/opener-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/opener-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/opener-backend:buildcache,mode=max

      # 6. Nginx 이미지 빌드 및 푸시
      - name: Build and push Nginx
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/opener-nginx:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # 7. EC2에 SSH 접속하여 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu  # Amazon Linux라면 ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Docker Hub 로그인
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # 기존 컨테이너 중지 및 제거
            cd /home/ubuntu/team2  # 실제 프로젝트 경로로 변경
            docker-compose -f docker-compose.dev.yml down
            
            # 최신 이미지 pull
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            docker-compose -f docker-compose.dev.yml pull
            
            # 컨테이너 실행
            docker-compose -f docker-compose.dev.yml up -d
            
            # 사용하지 않는 이미지 정리
            docker image prune -af