version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: db-prod
    environment:
      - POSTGRES_DB=proddb
      - POSTGRES_USER=produser
      - POSTGRES_PASSWORD=produser123
      - TZ=Asia/Seoul
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - prod-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U produser -d proddb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis-prod
    environment:
      - TZ=Asia/Seoul
    command: redis-server --requirepass change_this_redis_password
    volumes:
      - redis_data_prod:/data
    networks:
      - prod-network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Backend (Spring Boot)
  backend:
    image: ${DOCKERHUB_USERNAME}/opener-backend:prod
    container_name: backend-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/proddb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod-network
    restart: always

  # Frontend
  frontend:
    image: ${DOCKERHUB_USERNAME}/opener-frontend:prod
    container_name: frontend-prod
    ports:
      - "3000:3000"
    networks:
      - prod-network
    restart: always

  # Nginx Reverse Proxy
  nginx:
    image: ${DOCKERHUB_USERNAME}/opener-nginx:prod
    container_name: nginx-prod
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - prod-network
    restart: always

networks:
  prod-network:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  certbot-www:
