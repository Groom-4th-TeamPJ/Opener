user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # [ADDED] nginx 버전 노출 방지
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'ref="$http_referer" origin="$http_origin" '
                    'acrm="$http_access_control_request_method" '
                    'acrh="$http_access_control_request_header" '
                    'ua="$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # [ADDED] 자원 보호(스캔/느린요청 방어 기본 타임아웃)
    # client_body_timeout 10s;
    # client_header_timeout 10s;
    # send_timeout 10s;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # [ADDED] 레이트리밋/커넥션 제한(봇/스캔 방어)
    # 서비스 성격에 맞게 rate/burst 조절 가능
    # limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=5r/s;
    # limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Upstream 설정
    upstream backend {
        server backend-dev:8080;
    }

    upstream frontend {
        server frontend-dev:3000;
    }

    # HTTP 서버
    server {
        listen 80;
        server_name opener.deving.xyz;

        # Let's Encrypt 인증 갱신을 위한 경로
        # [CHANGED] 인증 경로는 ^~ 권장(다른 location보다 우선)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 나머지 모든 요청은 HTTPS로
        # [CHANGED] $server_name 대신 $host 권장(호스트 헤더 그대로)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    map $http_origin $allowed_origin {
        default "";
        "" $scheme://$host;                  # ★ Origin 없는 요청은 same-origin으로 간주
        "https://opener.deving.xyz" $http_origin;
        "http://localhost:3000" $http_origin;
        "https://opener.vercel.app" $http_origin;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTPS 서버 (443 포트)
    server {
        listen 443 ssl;
        http2 on;
        server_name opener.deving.xyz;

        # SSL 인증서 경로
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL 프로토콜 및 암호화 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # SSL 세션 캐시
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS (보안 헤더)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # [ADDED] 기본 보안 헤더(운영 기본 세트)
        # add_header X-Content-Type-Options "nosniff" always;
        # add_header X-Frame-Options "DENY" always;
        # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # 클라이언트 최대 업로드 크기
        client_max_body_size 10M;

        # [ADDED] 전역 레이트리밋/커넥션 제한 적용(서버 단)
        # limit_req zone=req_per_ip burst=20 nodelay;
        # limit_conn conn_per_ip 50;

        # ============================================================
        # [ADDED] 운영 보안 차단 룰(스캔/민감파일 노출 방지)
        # ============================================================

        # 1) dotfile 차단 (.env, .git, .DS_Store 등)
        location ~ /\. {
            return 404;
        }

        # 2) 백업/임시 파일 차단
        location ~* \.(bak|old|save|swp|tmp|~)$ {
            return 404;
        }

        # 3) CI/CD, docker 관련 파일 차단
        location ~* ^/(Dockerfile|docker-compose(\.(yml|yaml|json))?)$ {
            return 404;
        }

        # 4) env/config 류 차단 (env.js, config.js 등)
        location ~* ^/(env(\..*)?\.js|config(\..*)?\.js|api/config\.js|app/config\.js)$ {
            return 404;
        }

        # 5) 이상한 경로 우회 패턴 차단 (..; 같은 변형)
        # (if는 location 밖에서만 사용 가능하니 여기 유지)
        if ($request_uri ~* "\.\.;|%2e%2e;") { return 404; }


        # ============================================================
        # API 요청 프록시 (백엔드)
        # ============================================================
        # [CHANGED] /api 는 보통 /api/ 로 들어오므로 ^~ + trailing slash 권장
        location ^~ /api/ {
            # CORS 설정
            if ($allowed_origin = "") { return 403; }

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept" always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept" always;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # 프록시 헤더
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            #proxy_set_header Origin $http_origin;

            # 백엔드의 CORS 헤더 숨기기
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;

            # 타임아웃 설정
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

        }

        # Chat API (SSE 스트리밍 응답 포함)
        # /message, /opener-analysis 등 SSE emitter로 응답하는 엔드포인트
        location ^~ /api/chat/ {
            # CORS 설정
            if ($allowed_origin = "") { return 403; }

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept" always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # 프록시 헤더
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 백엔드 CORS 헤더 숨기기 (Nginx에서 관리)
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;

            # SSE/스트리밍 응답 지원: 버퍼링 비활성화
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            add_header X-Accel-Buffering no always;

            # 타임아웃 (SSE 장시간 연결 지원)
            proxy_read_timeout 5m;
            proxy_send_timeout 5m;
            proxy_connect_timeout 5m;
        }

        # SSE 연결 전용 (Server-Sent Events)
        # /api/chat/connect는 더 긴 타임아웃 필요
        location ^~ /api/chat/connect {
            # CORS 설정 (SSE도 cross-origin 요청이므로 필수!)
            if ($allowed_origin = "") { return 403; }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header X-SSE-Location hit always;   # 디버깅용 (나중에 제거)

            proxy_pass http://backend;

            # SSE는 HTTP/1.1 사용 (HTTP/2에서 SSE 문제 방지)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 프록시 헤더 (백엔드에서 클라이언트 정보 확인 필요)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 필수 설정: 버퍼링 비활성화
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no always;

            # SSE 타임아웃 (장시간 연결 유지)
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_connect_timeout 5m;
        }

        # ============================================================
        # 프론트엔드 요청 프록시
        # ============================================================

        # [ADDED] 정적 리소스 캐시(프론트 이미지/JS/CSS 성능 + 로그 노이즈 감소)
        # ※ 프론트가 nginx에서 직접 정적을 서빙하는 구조일 때 효과 큼
        # 지금은 프록시 구조라 캐시 효과는 제한적이지만, 혹시 nginx가 정적을 직접 서빙할 때 대비로 넣어둠.
        location ~* \.(?:css|js|map|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;

            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }


        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # 프록시 헤더
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃 설정
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }
}
