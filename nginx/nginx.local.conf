user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'ref="$http_referer" origin="$http_origin" '
                    'ua="$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # ============================================================
    # Upstream (docker-compose 서비스명 사용)
    # ============================================================
    upstream backend {
        server backend:8080;   # docker-compose.yml의 서비스명:포트
    }

    upstream frontend {
        server frontend:3000;  # docker-compose.yml의 서비스명:포트
    }

    # ============================================================
    # CORS 허용 origin 매핑
    # ============================================================
    map $http_origin $allowed_origin {
        default "";
        ""                          $scheme://$host;        # Origin 없는 요청 → same-origin
        "http://localhost:3000"     $http_origin;           # 프론트 dev server (직접 접근 시)
        "http://localhost:80"       $http_origin;           # nginx를 통한 요청
        "http://localhost"          $http_origin;           # 포트 생략 시도
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ============================================================
    # HTTP 서버 (로컬용 → 80포트만 사용, SSL 없음)
    # ============================================================
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # ============================================================
        # API 요청 프록시 (백엔드)
        # ============================================================
        location ^~ /api/ {
            # CORS
            if ($allowed_origin = "") { return 403; }

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept" always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept" always;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 백엔드의 CORS 헤더 숨기기 (nginx에서 통일 관리)
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================================
        # Chat API (SSE 스트리밍 응답 포함)
        # ============================================================
        location ^~ /api/chat/ {
            if ($allowed_origin = "") { return 403; }

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept" always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;

            # SSE: 버퍼링 비활성화
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            add_header X-Accel-Buffering no always;

            proxy_read_timeout 5m;
            proxy_send_timeout 5m;
            proxy_connect_timeout 5m;
        }

        # ============================================================
        # SSE 연결 전용 (/api/chat/connect)
        # ============================================================
        location ^~ /api/chat/connect {
            if ($allowed_origin = "") { return 403; }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: 버퍼링 비활성화
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering no always;

            # SSE: 장시간 연결 유지
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_connect_timeout 5m;
        }

        # ============================================================
        # 프론트엔드 요청 프록시
        # ============================================================

        # 정적 리소스 캐시
        location ~* \.(?:css|js|map|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;

            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 기본 경로 → 프론트엔드
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }
}